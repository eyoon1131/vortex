 # Test cases for `tensor_tmem` (UMMA/TMEM).
category: tensor_tmem
defaults:
  xlen:
  - 32
  - 64
  tier: smoke
  touches: [hw/rtl/tcu, sim/simx/tcu, sw/kernel/include/vx_tensor.h]
tests:
- id: sgemm_tcu_tmem-1
  via: blackbox
  drivers:
  - simx
  app: sgemm_tcu_tmem
  configs: -DVX_CFG_NUM_THREADS=8 -DVX_CFG_NUM_WARPS=8 -DVX_CFG_ISSUE_WIDTH=4 -DVX_CFG_EXT_TCU_ENABLE -DVX_CFG_TCU_WGMMA_ENABLE
    -DVX_CFG_TCU_TMEM_ENABLE -DITYPE=fp16 -DOTYPE=fp32 -DUMMA_NRC=8

- id: sgemm_tcu_tmem-2
  via: blackbox
  drivers:
  - rtlsim
  app: sgemm_tcu_tmem
  configs: -DVX_CFG_NUM_THREADS=8 -DVX_CFG_NUM_WARPS=8 -DVX_CFG_ISSUE_WIDTH=4 -DVX_CFG_EXT_TCU_ENABLE -DVX_CFG_TCU_WGMMA_ENABLE
    -DVX_CFG_TCU_TMEM_ENABLE -DITYPE=fp16 -DOTYPE=fp32 -DUMMA_NRC=8

- id: sgemm_tcu_tmem-3
  via: blackbox
  drivers:
  - simx
  app: sgemm_tcu_tmem
  configs: -DVX_CFG_NUM_THREADS=8 -DVX_CFG_NUM_WARPS=8 -DVX_CFG_ISSUE_WIDTH=4 -DVX_CFG_EXT_TCU_ENABLE -DVX_CFG_TCU_WGMMA_ENABLE
    -DVX_CFG_TCU_TMEM_ENABLE -DVX_CFG_TCU_INT8_ENABLE -DITYPE=int8 -DOTYPE=int32 -DUMMA_NRC=8

- id: sgemm_tcu_tmem-4
  via: blackbox
  drivers:
  - rtlsim
  app: sgemm_tcu_tmem
  configs: -DVX_CFG_NUM_THREADS=8 -DVX_CFG_NUM_WARPS=8 -DVX_CFG_ISSUE_WIDTH=4 -DVX_CFG_EXT_TCU_ENABLE -DVX_CFG_TCU_WGMMA_ENABLE
    -DVX_CFG_TCU_TMEM_ENABLE -DVX_CFG_TCU_INT8_ENABLE -DITYPE=int8 -DOTYPE=int32 -DUMMA_NRC=8

- id: sgemm_tcu_tmem-5
  via: blackbox
  drivers:
  - simx
  app: sgemm_tcu_tmem
  configs: -DVX_CFG_NUM_THREADS=8 -DVX_CFG_NUM_WARPS=8 -DVX_CFG_ISSUE_WIDTH=4 -DVX_CFG_EXT_TCU_ENABLE -DVX_CFG_TCU_WGMMA_ENABLE
    -DVX_CFG_TCU_TMEM_ENABLE -DVX_CFG_TCU_INT8_ENABLE -DITYPE=uint8 -DOTYPE=int32 -DUMMA_NRC=8

- id: sgemm_tcu_tmem-6
  via: blackbox
  drivers:
  - simx
  app: sgemm_tcu_tmem
  configs: -DVX_CFG_NUM_THREADS=8 -DVX_CFG_NUM_WARPS=8 -DVX_CFG_ISSUE_WIDTH=4 -DVX_CFG_EXT_TCU_ENABLE -DVX_CFG_TCU_WGMMA_ENABLE
    -DVX_CFG_TCU_TMEM_ENABLE -DVX_CFG_TCU_TF32_ENABLE -DITYPE=tf32 -DOTYPE=fp32 -DUMMA_NRC=8

- id: sgemm_tcu_tmem-7
  via: blackbox
  drivers:
  - simx
  app: sgemm_tcu_tmem
  configs: -DVX_CFG_NUM_THREADS=8 -DVX_CFG_NUM_WARPS=8 -DVX_CFG_ISSUE_WIDTH=4 -DVX_CFG_EXT_TCU_ENABLE -DVX_CFG_TCU_WGMMA_ENABLE
    -DVX_CFG_TCU_TMEM_ENABLE -DITYPE=bf16 -DOTYPE=fp32 -DUMMA_NRC=8

